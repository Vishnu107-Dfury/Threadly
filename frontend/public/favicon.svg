<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Threadly minimal spool + trailing 'T' mark -->
  <!-- Top flange -->
  <path d="M5 7h14c1.1 0 2-.9 2-2s-.9-2-2-2H5C3.9 3 3 3.9 3 5s.9 2 2 2z" fill="#4338CA"/>
  <!-- Central wound spool core -->
  <rect x="6.5" y="7" width="11" height="14" rx="1.5" fill="#4338CA" fill-opacity="0.15" stroke="#4338CA" stroke-width="1.5"/>
  <line x1="6.5" y1="11" x2="17.5" y2="11" stroke="#4338CA" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="6.5" y1="14" x2="17.5" y2="14" stroke="#4338CA" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="6.5" y1="17" x2="17.5" y2="17" stroke="#4338CA" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Bottom flange -->
  <path d="M5 25h14c1.1 0 2-.9 2-2s-.9-2-2-2H5c-1.1 0-2 .9-2 2s.9 2 2 2z" fill="#4338CA"/>
  <!-- Trailing thread unspooling from bottom and forming loop 'T' -->
  <path d="M12 24c0 3 4 5 7 5s5-2 5-6V10M20 10h8" stroke="#F97316" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>